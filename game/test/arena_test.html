<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arena test</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 6px; color: #9aa; font: 12px/1.35 ui-monospace, monospace; white-space: pre; pointer-events: none; z-index: 2; text-shadow: 0 1px 2px #000; }
</style>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="hud"></div>
<script type="module">
// Arena test bench.
//   ?shots=1   no rAF loop (driven by arena_shots.mjs through window.__* hooks)
//   ?notex=1   exercise the procedural texture fallbacks
//   ?q=low|medium|high
// Interactive (default): drag to look, WASD/QE to fly, 0-3 = setPhase, R = ripples at the camera, 1..6 keys on the numpad not needed.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAPass } from 'three/addons/postprocessing/FXAAPass.js';
import { createArena } from '../src/arena.js';

const params = new URLSearchParams(location.search);
const SHOTS = params.has('shots');
const hud = document.getElementById('hud');
window.__errors = [];
window.addEventListener('error', (e) => window.__errors.push(String(e.message || e)));

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = Number(params.get('exposure') || 1.0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 400); // as main.js

// textures (what main.js is expected to pass)
const loader = new THREE.TextureLoader();
const load = (url) => new Promise((res) => loader.load(url, (t) => res(t), undefined, () => res(null)));
const noTex = params.has('notex');
const [roseWindow, stoneFloor, stoneWall] = noTex ? [null, null, null]
  : await Promise.all(['rose_window', 'stone_floor', 'stone_wall'].map((n) => load(`../assets/textures/${n}.png`)));
for (const t of [roseWindow, stoneFloor, stoneWall]) if (t) t.colorSpace = THREE.SRGBColorSpace;

const t0 = performance.now();
const arena = await createArena({ scene, renderer, textures: { roseWindow, stoneFloor, stoneWall }, quality: params.get('q') || 'high' });
const buildMs = performance.now() - t0;
window.__arena = arena;
// debug toggles for A/B checks
if (params.has('nobump') || params.has('noenv') || params.has('nospec')) {
  scene.traverse((o) => {
    const m = o.material;
    if (!m) return;
    for (const mm of Array.isArray(m) ? m : [m]) {
      if (params.has('nobump') && mm.userData.tpUniforms) mm.userData.tpUniforms.tpBump.value = 0;
      if (params.has('nospec') && mm.isMeshStandardMaterial) mm.envMapIntensity = 0;
    }
  });
  if (params.has('noenv')) scene.environment = null;
}
if (params.has('hide')) for (const n of params.get('hide').split(',')) { const o = scene.getObjectByName(n); if (o) o.visible = false; }
if (params.has('nokey')) arena.keyLight.visible = false;

// --- scale stand-ins ---------------------------------------------------------------------------
const standins = new THREE.Group();
scene.add(standins);
const armour = new THREE.MeshStandardMaterial({ color: 0x5b5650, roughness: 0.45, metalness: 0.65 });
const cloak = new THREE.MeshStandardMaterial({ color: 0x2c2620, roughness: 0.9, metalness: 0.0 });
const player = new THREE.Group();
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1.1, 6, 16), armour);
body.position.y = 0.85;
const cape = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.42, 1.2, 16, 1, true, -Math.PI * 0.75, Math.PI * 1.5), cloak);
cape.material.side = THREE.DoubleSide;
cape.position.set(0, 0.95, 0.04);
cape.rotation.y = Math.PI;
player.add(body, cape);
player.position.set(arena.playerSpawn.x, 0, arena.playerSpawn.z);
player.rotation.y = arena.playerSpawn.yaw;
standins.add(player);

const robe = new THREE.MeshStandardMaterial({ color: 0xd9d1c2, roughness: 0.82, metalness: 0.0 });
const gold = new THREE.MeshStandardMaterial({ color: 0xc9a24a, roughness: 0.35, metalness: 1.0 });
const boss = new THREE.Group();
const dress = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 1.9, 1.3, 32), robe);
dress.position.y = 0.65;
const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.62, 1.05, 24), robe);
torso.position.y = 1.75;
const shoulders = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 12), robe);
shoulders.scale.set(1.25, 0.55, 0.85);
shoulders.position.y = 2.2;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, 20, 12), robe);
head.position.set(0, 2.42, -0.05);
const hood = new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.55, 20), robe);
hood.position.set(0, 2.38, 0.02);
boss.add(dress, torso, shoulders, head, hood);
// seven swords in her back (just for the silhouette)
for (let i = 0; i < 7; i++) {
  const a = (i - 3) * 0.32;
  const sword = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.5, 0.015), armour);
  sword.position.set(Math.sin(a) * 0.5, 2.1 + Math.cos(a) * 0.5, 0.35);
  sword.rotation.set(-0.5, 0, -a);
  boss.add(sword);
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.05), gold);
  guard.position.copy(sword.position).add(new THREE.Vector3(Math.sin(a) * 0.55, Math.cos(a) * 0.55, 0.2));
  guard.rotation.z = -a;
  boss.add(guard);
}
boss.position.set(arena.bossSpawn.x, 0, arena.bossSpawn.z);
boss.rotation.y = arena.bossSpawn.yaw + Math.PI; // stand-in modelled facing +Z; turn so her back faces the player
standins.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

// --- post: mirrors src/main.js (bloom 0.62/0.5/0.95 -> grade + vignette -> OutputPass -> FXAA) ------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.62, 0.5, 0.95);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVignette: { value: 0.42 }, uWarm: { value: 0 }, uDesat: { value: 0.12 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uTime, uVignette, uWarm, uDesat; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5; float r = length(c);
      vec2 off = c * 0.0006;
      vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
      float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(col, vec3(l), uDesat);
      col *= mix(vec3(0.92, 0.97, 1.08), vec3(1.06, 1.0, 0.9), smoothstep(0.05, 1.2, l));
      col = mix(col, col * vec3(1.12, 1.0, 0.82), uWarm);
      col *= 1.0 - uVignette * smoothstep(0.32, 0.85, r);
      col += (hash(vUv * 1000.0 + uTime) - 0.5) * 0.018;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());
composer.addPass(new FXAAPass());

// --- cameras -----------------------------------------------------------------------------------------
const CAMS = {
  // behind the heroine at the spawn, key-art composition
  entrance: { pos: [0, 2.45, 43.6], look: [0, 6.2, -50], fov: 50 },
  // gameplay rig (dist 4.3, pitch ~0.16) with the heroine mid-fight in the light pool
  gameplay: { pos: [0.8, 2.25, -3.2], look: [0.3, 1.9, -12], fov: 55, player: [0.4, -7.5] },
  // intro-style low angle toward the boss and the window (cutscene t~15 s)
  lowangle: { pos: [1.6, 0.45, -15.2], look: [0, 4.4, -22], fov: 46 },
  mid: { pos: [-8.6, 3.3, 9.5], look: [2.5, 5.0, -24], fov: 55 },
  altar: { pos: [3.2, 1.55, -13.5], look: [0, 19, -50], fov: 60 },
  ripples: { pos: [0.6, 0.95, 38.6], look: [0, 0.35, 29], fov: 50, player: [0.2, 30.5] },
  third: { pos: [0, 2.2, 42.3], look: [0, 1.8, 30], fov: 55 },
  side: { pos: [-19, 2.2, -2], look: [8, 6, -22], fov: 60 },
  aisle: { pos: [-18.5, 1.8, 20], look: [-14, 3, -10], fov: 60 },
  top: { pos: [0, 40, 30], look: [0, 0, -10], fov: 60 },
};
let camName = 'entrance';
let yaw = 0, pitch = 0;
function setCam(name) {
  const c = CAMS[name] || CAMS.entrance;
  camName = name;
  camera.position.set(...c.pos);
  camera.fov = c.fov;
  camera.updateProjectionMatrix();
  camera.lookAt(...c.look);
  camera.updateMatrixWorld();
  const pp = c.player || [arena.playerSpawn.x, arena.playerSpawn.z];
  player.position.set(pp[0], 0, pp[1]);
  const dir = camera.getWorldDirection(new THREE.Vector3());
  yaw = Math.atan2(-dir.x, -dir.z); pitch = Math.asin(dir.y);
}
window.__setCam = setCam;

let elapsed = 0;
function step(seconds, dt = 1 / 60) {
  const n = Math.max(1, Math.round(seconds / dt));
  for (let i = 0; i < n; i++) { elapsed += dt; arena.update(dt, elapsed, camera); }
}
function render() {
  renderer.info.reset();
  composer.render();
}
window.__step = (s) => step(s);
window.__render = () => { render(); return info(); };
window.__setPhase = (p) => arena.setPhase(p);
window.__ripple = (x, z, s = 1) => arena.ripple(x, z, s);
window.__bloom = (s, r, t) => { bloom.strength = s; bloom.radius = r; bloom.threshold = t; };
window.__exposure = (e) => { renderer.toneMappingExposure = e; };
window.__showStandins = (v) => { standins.visible = v; };
function info() {
  const i = renderer.info;
  return { calls: i.render.calls, triangles: i.render.triangles, points: i.render.points, geometries: i.memory.geometries, textures: i.memory.textures, programs: i.programs.length };
}
window.__info = info;
window.__resize = (w, h) => {
  renderer.setSize(w, h);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
};
// Throughput benchmark: frames rendered back to back, GPU drained at the end.
window.__bench = (frames = 120) => {
  const gl = renderer.getContext();
  const px = new Uint8Array(4);
  render(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const t = performance.now();
  for (let i = 0; i < frames; i++) {
    elapsed += 1 / 60;
    arena.update(1 / 60, elapsed, camera);
    render();
  }
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const total = performance.now() - t;
  // per-frame latency with a sync after every frame (upper bound)
  const t2 = performance.now();
  const n2 = Math.max(10, frames >> 2);
  for (let i = 0; i < n2; i++) { arena.update(1 / 60, elapsed, camera); render(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
  const synced = (performance.now() - t2) / n2;
  return { msPerFrame: total / frames, msSynced: synced, ...info() };
};

setCam(params.get('cam') || 'entrance');
if (params.has('phase')) arena.setPhase(Number(params.get('phase')));
step(0.5);
render();
renderer.getContext().finish();
window.__buildMs = buildMs;
window.__ready = true;

// --- interactive mode ------------------------------------------------------------------------------
if (!SHOTS) {
  const keys = new Set();
  addEventListener('keydown', (e) => {
    keys.add(e.code);
    if (/^Digit[0-3]$/.test(e.code)) arena.setPhase(Number(e.code.slice(5)));
    if (e.code === 'KeyR') for (let i = 0; i < 4; i++) arena.ripple(camera.position.x + (Math.random() - 0.5) * 4, camera.position.z - 3 - Math.random() * 4, 1);
    if (e.code === 'KeyC') { const names = Object.keys(CAMS); setCam(names[(names.indexOf(camName) + 1) % names.length]); }
  });
  addEventListener('keyup', (e) => keys.delete(e.code));
  let drag = false;
  renderer.domElement.addEventListener('pointerdown', () => { drag = true; });
  addEventListener('pointerup', () => { drag = false; });
  addEventListener('pointermove', (e) => {
    if (!drag) return;
    yaw -= e.movementX * 0.003; pitch = THREE.MathUtils.clamp(pitch - e.movementY * 0.003, -1.5, 1.5);
  });
  addEventListener('resize', () => window.__resize(innerWidth, innerHeight));
  let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
  const loop = (now) => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
    const v = new THREE.Vector3((keys.has('KeyD') - keys.has('KeyA')), (keys.has('KeyE') - keys.has('KeyQ')), (keys.has('KeyS') - keys.has('KeyW')));
    camera.position.add(v.multiplyScalar(dt * (keys.has('ShiftLeft') ? 18 : 6)).applyEuler(new THREE.Euler(0, yaw, 0)));
    elapsed += dt;
    arena.update(dt, elapsed, camera);
    render();
    const i = renderer.info.render;
    hud.textContent = `fps ${fps.toFixed(0)}  calls ${i.calls}  tris ${(i.triangles / 1000).toFixed(0)}k  phase ${arena.phase}  [0-3 phase, R ripple, C camera, drag+WASD/QE]`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
